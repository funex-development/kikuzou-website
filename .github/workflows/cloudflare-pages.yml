name: Cloudflare Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build:cloudflare

      - name: Deploy production
        id: deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'funex-development/kikuzou-website'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.160.1
          command: pages deploy out --project-name=kikuzou-website --branch=master --commit-hash=${{ github.sha }}

      - name: Check production HTTPS
        if: steps.deploy.outcome == 'success'
        run: |
          for route in / /about /menu /access /reserve /faq /robots.txt /sitemap.xml; do
            curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 3 --max-time 30 \
              --user-agent 'Funex-Kikuzou-Migration-Check/1.0 (+https://www.matsumoto-kikuzou.com/)' \
              "https://www.matsumoto-kikuzou.com${route}" > /dev/null
          done
